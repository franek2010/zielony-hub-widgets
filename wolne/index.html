<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ile do wolnego — Zielony Hub</title>
<style>
:root{
  --notion:#191919;
  --card:#263D30;
  --card2:#32483B;
  --text:#F2F3ED;
  --muted:#87968A;

  --sage:#9DBB9A;
  --sage-deep:#78957A;
  --mist:#8FA7A2;
  --lav:#9C93A6;

  --accent:#8FCB7B;
  --accent2:#6FA67A;
  --line:rgba(255,255,255,.065);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--notion);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
#root{
  width:100vw;
  height:100vh;
  margin:0;
  padding:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:var(--notion);
}
.widget{
  width:min(100%, 620px);
  height:auto;
  min-width:0;
  background:var(--card);
  border-radius:12px;
  padding:15px 16px 14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  flex:0 0 auto;
}
.title{
  position:relative;
  font-size:13px;
  font-weight:760;
  letter-spacing:-.01em;
  color:var(--text);
  padding-left:11px;
}
.title::before{
  content:"";
  position:absolute;
  left:0;
  top:2px;
  bottom:2px;
  width:3px;
  border-radius:999px;
  background:var(--sage);
  opacity:.82;
}
.micro{
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:rgba(242,243,237,.26);
  white-space:nowrap;
}
.hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) 110px;
  gap:12px;
  align-items:stretch;
  margin-bottom:10px;
  flex:0 0 auto;
}
.hero-main{
  background:
    linear-gradient(135deg,rgba(157,187,154,.055),rgba(143,167,162,.03) 58%),
    rgba(0,0,0,.065);
  border:1px solid rgba(157,187,154,.10);
  border-radius:10px;
  padding:12px 13px 11px;
  min-width:0;
}
.kicker{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--muted);
  margin-bottom:5px;
}
.hero-name{
  font-size:18px;
  font-weight:820;
  letter-spacing:-.025em;
  line-height:1.05;
  margin-bottom:7px;
}
.hero-date{
  font-size:10px;
  color:var(--muted);
}
.countbox{
  position:relative;
  background:#30473A;
  color:var(--text);
  border:1px solid rgba(255,255,255,.055);
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:88px;
  overflow:hidden;
}
.countbox::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:3px;
  background:var(--sage);
  opacity:.72;
}
.count{
  font-size:32px;
  font-weight:820;
  line-height:.9;
  color:#C8D3CA;
  font-variant-numeric:tabular-nums;
}
.count-label{
  margin-top:5px;
  font-size:8px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#7F9183;
}
.timeline{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  flex:1 1 auto;
  min-height:0;
}
.tile{
  position:relative;
  min-width:0;
  background:#2B4335;
  border:1px solid rgba(255,255,255,.05);
  border-radius:9px;
  padding:10px 10px 9px;
  overflow:hidden;
}
.tile:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:2px;
  background:var(--sage-deep);
  opacity:.66;
}


.tile-name{
  font-size:11px;
  font-weight:730;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-left:3px;
}
.tile-meta{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  margin-top:6px;
  padding-left:3px;
}
.tile-date{
  font-size:9px;
  color:var(--muted);
  white-space:nowrap;
}
.tile-days{
  font-size:13px;
  font-weight:760;
  color:#86A78D;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

@media(max-width:560px){
  .hero{grid-template-columns:1fr 92px}
  .count{font-size:30px}
  .timeline{grid-template-columns:1fr}
  html,body{overflow:auto}
}
</style>
</head>
<body>
<div id="root">
  <section class="widget" aria-label="Ile do wolnego">
    <div class="top">
      <div class="title">Ile do wolnego</div>
      <div class="micro">szkolny radar</div>
    </div>

    <div class="hero">
      <div class="hero-main">
        <div class="kicker">najbliższe wolne</div>
        <div class="hero-name" id="heroName">Weekend</div>
        <div class="hero-date" id="heroDate">—</div>
      </div>
      <div class="countbox">
        <div class="count" id="heroCount">0</div>
        <div class="count-label" id="heroLabel">dni</div>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>
  </section>
</div>

<script>
(function(){
  const DAY=86400000;
  const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=(d,now)=>Math.max(0,Math.round((sod(d)-sod(now))/DAY));
  const fmt=d=>new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'short'}).format(d);

  function easterSunday(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),
    day=((h+l-7*m+114)%31)+1;
    return new Date(y,month-1,day);
  }

  function addDays(d,n){
    const x=new Date(d);
    x.setDate(x.getDate()+n);
    return x;
  }

  function nextWeekend(now){
    const d=now.getDay();
    if(d===6 || d===0){
      // Nie pokazujemy "trwa" — najbliższe wolne po prostu ma 0 dni.
      return {name:'Weekend',date:sod(now),kind:'weekend'};
    }
    return {name:'Weekend',date:addDays(sod(now),6-d),kind:'weekend'};
  }

  // Oficjalne ogólnopolskie przerwy szkolne 2026/2027.
  const schoolBreaks=[
    {name:'Przerwa świąteczna',date:new Date(2026,11,23),until:new Date(2026,11,31)},
    {name:'Wiosenna przerwa',date:new Date(2027,2,25),until:new Date(2027,2,30)},
    {name:'Wakacje',date:new Date(2027,5,26),until:new Date(2027,7,31)}
  ];

  function statutory(y){
    const easter=easterSunday(y);
    return [
      {name:'Nowy Rok',date:new Date(y,0,1)},
      {name:'Trzech Króli',date:new Date(y,0,6)},
      {name:'Poniedziałek Wielkanocny',date:addDays(easter,1)},
      {name:'1 maja',date:new Date(y,4,1)},
      {name:'3 maja',date:new Date(y,4,3)},
      {name:'Boże Ciało',date:addDays(easter,60)},
      {name:'15 sierpnia',date:new Date(y,7,15)},
      {name:'Wszystkich Świętych',date:new Date(y,10,1)},
      {name:'11 listopada',date:new Date(y,10,11)},
      {name:'Boże Narodzenie',date:new Date(y,11,25)},
      {name:'Drugi dzień Świąt',date:new Date(y,11,26)}
    ];
  }

  function inBreak(d){
    return schoolBreaks.some(b=>sod(d)>=sod(b.date)&&sod(d)<=sod(b.until));
  }

  function collect(now){
    let events=[nextWeekend(now)];

    for(const b of schoolBreaks){
      if(sod(b.until)>=sod(now)){
        const active=sod(now)>=sod(b.date)&&sod(now)<=sod(b.until);
        events.push({
          name:b.name,
          date:active?sod(now):b.date,
          until:b.until,
          kind:'break'
        });
      }
    }

    for(const y of [now.getFullYear(),now.getFullYear()+1]){
      for(const e of statutory(y)){
        if(sod(e.date)<sod(now)) continue;
        const dow=e.date.getDay();
        if(dow===0||dow===6) continue;
        if(inBreak(e.date)) continue;
        events.push({...e,kind:'holiday'});
      }
    }

    const seen=new Set();
    events=events.filter(e=>{
      const key=e.name+'|'+sod(e.date).getTime();
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    events.sort((a,b)=>sod(a.date)-sod(b.date));
    return events;
  }

  function render(){
    const now=new Date();
    const events=collect(now);
    const hero=events[0];
    const heroDays=diff(hero.date,now);

    document.getElementById('heroName').textContent=hero.name;
    document.getElementById('heroDate').textContent=
      hero.until ? `${fmt(hero.date)} – ${fmt(hero.until)}` : fmt(hero.date);
    document.getElementById('heroCount').textContent=heroDays;
    document.getElementById('heroLabel').textContent=heroDays===1?'dzień':'dni';

    const timeline=document.getElementById('timeline');
    timeline.innerHTML='';

    events.slice(1,4).forEach(e=>{
      const d=diff(e.date,now);
      const tile=document.createElement('div');
      tile.className='tile';
      tile.innerHTML=
        '<div class="tile-name"></div>'+
        '<div class="tile-meta">'+
          '<div class="tile-date"></div>'+
          '<div class="tile-days"></div>'+
        '</div>';

      tile.querySelector('.tile-name').textContent=e.name;
      tile.querySelector('.tile-date').textContent=
        e.until ? `${fmt(e.date)}–${fmt(e.until)}` : fmt(e.date);
      tile.querySelector('.tile-days').textContent=
        d===1 ? '1 dzień' : d+' dni';

      timeline.appendChild(tile);
    });
  }

  render();
  setInterval(render,60000);
})();
</script>
</body>
</html>

<style>
.tile:nth-child(2)::before{background:var(--mist);opacity:.72}
.tile:nth-child(3)::before{background:var(--lav);opacity:.66}

.tile-days{color:#8DAF91}

.tile:nth-child(3) .tile-days{color:#9C93A6}
</style>
