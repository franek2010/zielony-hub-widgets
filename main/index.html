<title>Zielony Hub — połączony układ</title>
<style>
:root {
  --page:#191919;
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--page);
}
body {
  overflow-x:hidden;
}
.hub {
  width:100%;
  background:var(--page);
}
.frame {
  display:block;
  width:100%;
  border:0;
  background:transparent;
  overflow:hidden;
}

/* HERO */
.hero {
  height:472px;
}

/* GÓRNY UKŁAD POD HERO */
.top-grid {
  display:grid;
  grid-template-columns:1.08fr .92fr;
  column-gap:48px;
  align-items:start;
  padding:0 18px 0;
  margin-top:0;
}

/*
  LEWA STRONA — Dzień.
  Celowo podniesiona względem prawego "Ile do wolnego",
  aby była bliżej covera i kończyła się wyżej niż prawa karta.
*/
.day-wrap {
  transform:translateY(-92px);
  justify-self:start;
  width:100%;
}
.day {
  height:205px;
  width:100%;
}

/* PRAWA STRONA */
.free-wrap {
  transform:translateY(-8px);
  justify-self:end;
  width:100%;
}
.free {
  height:232px;
  width:100%;
}


@media(max-width:1100px) {
  .hero { height:430px; }
  .top-grid {
    column-gap:30px;
    padding-left:14px;
    padding-right:14px;
    padding-bottom:0;
  }
  .day-wrap { transform:translateY(-72px); }
  .free-wrap { transform:translateY(-6px); }
}

@media(max-width:760px) {
  .hero { height:390px; }
  .top-grid {
    grid-template-columns:1fr;
    gap:12px;
    padding:0 10px 0;
  }
  .day-wrap,
  .free-wrap {
    transform:none;
  }
  .day {
    height:170px;
  }
  .free {
    height:320px;
  }
}
</style>
