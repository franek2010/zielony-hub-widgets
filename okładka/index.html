<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zielony Hub — cover + zegar V4</title>
<style>
:root{
  --page:#191919;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--page);
  font-family:var(--ui);
}
#root{
  width:100%;
  height:410px;
  position:relative;
  overflow:hidden;
  background:var(--page);
}
.cover{
  position:absolute;
  inset:0 0 auto 0;
  height:235px;
  overflow:hidden;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
/* Zegar: dokładny styl z 13-makieta-v4-oceny-i-wow, tylko większy */
.zegar{
  position:absolute;
  right:3.8%;
  top:105px;
  width:430px;
  border-radius:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.85),0 20px 50px rgba(0,0,0,.35);
  z-index:10;
}
.zegar canvas{
  border-radius:14px;
  width:100%;
  display:block;
}
.zegar .naw{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
}
.zcyfry{display:flex;gap:12px;align-items:stretch}
.zk{
  position:relative;
  min-width:112px;
  padding:14px 16px 20px;
  border-radius:11px;
  background:rgba(255,255,255,.10);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.zk .d{
  font:700 60px/1 var(--ui);
  letter-spacing:-.045em;
  color:#F6F2E6;
  font-variant-numeric:tabular-nums;
  text-align:center;
}
.zk::after{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:1px;
  background:rgba(0,0,0,.26);
}
.zk .cap{
  position:absolute;
  left:0;right:0;bottom:6px;
  text-align:center;
  font:700 8.5px var(--ui);
  letter-spacing:.17em;
  text-transform:uppercase;
  color:rgba(246,242,230,.66);
}
.zdzien{
  margin-top:13px;
  font:400 25px/1 Georgia,"Times New Roman",serif;
  font-style:italic;
  color:#EBDFAE;
  letter-spacing:.01em;
}
.zdata{
  margin-top:6px;
  font:600 11px var(--ui);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(246,242,230,.55);
}
@media(max-width:900px){
  #root{height:385px}
  .cover{height:225px}
  .zegar{width:380px;right:3%;top:102px}
}
@media(max-width:620px){
  #root{height:345px}
  .cover{height:205px}
  .zegar{width:290px;right:14px;top:98px}
  .zk{min-width:82px;padding:10px 12px 17px}
  .zk .d{font-size:44px}
  .zk .cap{font-size:7px}
  .zdzien{font-size:20px;margin-top:10px}
  .zdata{font-size:9px}
}
</style>

    document.getElementById('dzien').textContent=DNI[d.getDay()];
    document.getElementById('data').textContent=d.getDate()+' '+MIE[d.getMonth()];
  }
  tik();
  setInterval(tik,15000);
})();

function ciemno(){return true;}
function ctxOf(c){var x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);return x;}
function rr(x,a,b,w,h,r){
  x.beginPath();
  x.moveTo(a+r,b);
  x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r);
  x.arcTo(a,b,a+w,b,r);
  x.closePath();
}

/* Dokładne tło zegara z załączonego 13-makieta-v4-oceny-i-wow */
function zegarTlo(c){
  var x=ctxOf(c),W=c.width,H=c.height,d=ciemno();
  var g=x.createLinearGradient(0,0,W,H);
  if(d){g.addColorStop(0,'#1D3325');g.addColorStop(1,'#0F1C15');}
  else{g.addColorStop(0,'#5E7C5A');g.addColorStop(1,'#3F5A3B');}
  x.fillStyle=g;x.fillRect(0,0,W,H);

  var pl=x.createRadialGradient(W*.22,H*.14,8,W*.22,H*.14,W*.62);
  pl.addColorStop(0,'rgba(224,192,112,.24)');
  pl.addColorStop(1,'rgba(224,192,112,0)');
  x.fillStyle=pl;x.fillRect(0,0,W,H);

  x.strokeStyle='rgba(246,242,230,.16)';
  x.lineWidth=2;
  rr(x,16,16,W-32,H-32,20);
  x.stroke();

  x.strokeStyle='rgba(224,192,112,.42)';
  x.lineWidth=2;
  var m=30,r=16;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(function(p){
    x.beginPath();
    x.moveTo(p[0]+p[2]*r*2,p[1]);
    x.lineTo(p[0],p[1]);
    x.lineTo(p[0],p[1]+p[3]*r*2);
    x.stroke();
  });

  x.globalAlpha=.16;
  x.fillStyle='#F6F2E6';
  for(var i=0;i<26;i++){
    var a=i/26*Math.PI*2;
    x.beginPath();
    x.arc(W*.5+Math.cos(a)*W*.40,H*.5+Math.sin(a)*H*.40,1.6,0,7);
    x.fill();
  }
  x.globalAlpha=1;
}
zegarTlo(document.getElementById('zegarTlo'));
</script>
