<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twój spokojny plan — ekstrakt</title>

<style>
:root{
  /* Kolory pobrane z załączonej wizualizacji */
  --bg:#191919;
  --border:#3A3A3A;
  --text:#F4F1E9;
  --dim:#8A9388;
  --accent:#C3E36A;
  --track:#2B2D26;
  --glow:rgba(195,227,106,.24);

  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#191919;
}

body{
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* Sam wyciągnięty panel */
.panel{
  width:100%;
  min-height:490px;
  background:#191919;
  border:0;
  border-radius:0;
  box-shadow:none;
  padding:0 18px;
  display:flex;
  align-items:center;
}

.content{
  width:100%;
  max-width:620px;
}

/* "TWÓJ SPOKOJNY PLAN" */
.eyebrow{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px;
  color:var(--accent);
  font:700 11px/1 var(--ui);
  letter-spacing:.15em;
  text-transform:uppercase;
}

.eyebrow::before{
  content:"";
  width:20px;
  height:1px;
  background:var(--accent);
}

/* Data */
h1{
  margin:0;
  color:var(--text);
  font:700 39px/1.04 var(--serif);
  letter-spacing:-.025em;
}

/* Pasek dnia */
.progress{
  margin-top:20px;
}

.labels{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
  color:var(--dim);
  font:400 12px/1 var(--ui);
}

#percent{
  color:#72936E;
}

.track{
  width:100%;
  height:7px;
  background:var(--track);
  border-radius:999px;
  overflow:hidden;
}

.fill{
  display:block;
  width:0%;
  height:100%;
  border-radius:999px;
  background:var(--accent);
  box-shadow:0 0 10px -3px var(--glow);
  transition:width .45s ease;
}

@media (max-width:600px){
  .panel{
    min-height:350px;
    padding:0 18px;
  }

  h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<section class="panel">
  <div class="content">

    <div class="eyebrow">Twój spokojny plan</div>

    <h1 id="date">Sobota, 29 sierpnia</h1>

    <div class="progress">
      <div class="labels">
        <span>Dzień</span>
        <span id="percent">12%</span>
      </div>

      <div class="track">
        <i class="fill" id="fill"></i>
      </div>
    </div>

  </div>
</section>

<script>
const DNI = [
  "Niedziela",
  "Poniedziałek",
  "Wtorek",
  "Środa",
  "Czwartek",
  "Piątek",
  "Sobota"
];

const MIES = [
  "stycznia",
  "lutego",
  "marca",
  "kwietnia",
  "maja",
  "czerwca",
  "lipca",
  "sierpnia",
  "września",
  "października",
  "listopada",
  "grudnia"
];

function update(){
  const now = new Date();

  document.getElementById("date").textContent =
    `${DNI[now.getDay()]}, ${now.getDate()} ${MIES[now.getMonth()]}`;

  /* Tak samo jak w źródłowym HTML:
     procent całej doby od 00:00 do 24:00 */
  const minutes = now.getHours() * 60 + now.getMinutes();
  const percent = Math.round((minutes / (24 * 60)) * 100);

  document.getElementById("percent").textContent = percent + "%";
  document.getElementById("fill").style.width = percent + "%";
}

update();
setInterval(update, 20000);
</script>

</body>
</html>
